name: ML pipeline tests and synthetic training
on:
  push:
    paths:
      - "packages/ml/**"
      - "tests/**"
      - "requirements-training.txt"
      - ".github/workflows/ml-tests.yml"
  pull_request:
    paths:
      - "packages/ml/**"
      - "tests/**"
      - "requirements-training.txt"
      - ".github/workflows/ml-tests.yml"
jobs:
  test-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-training.txt
      - name: Install offline training dependencies
        run: python -m pip install -r requirements-training.txt
      - name: Run ML pipeline tests
        run: python -m pytest -q
      - name: Train reproducible synthetic pipeline candidate
        run: |
          python -m packages.ml.synthetic --out data/synthetic/monthly_upi_demo.csv --months 60
          python -m packages.ml.train --data data/synthetic/monthly_upi_demo.csv --out artifacts/synthetic-demo --series-id demo_upi_count
          python -m packages.ml.publish_bundle artifacts/synthetic-demo
      - name: Preserve synthetic model evidence
        uses: actions/upload-artifact@v4
        with:
          name: economic-pulse-synthetic-model-evidence
          path: artifacts/synthetic-demo/
          if-no-files-found: error
          retention-days: 14
